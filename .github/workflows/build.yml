name: Android CI Bionic Samsung Game Booster

on:
  workflow_dispatch:
  push:
    branches:
      - 4.1
      - samsung-gamebooster
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build information
        run: |
          COMMIT=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "BUILD_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "BUILD_SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL \
            "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" \
            -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so
          test -s app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Rename APK and create BUILD_INFO
        run: |
          mkdir -p artifacts
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "artifacts/Winlator-Ludashi-Vanilla-Samsung-GameBooster-${BUILD_SHORT}.apk"
          cat > artifacts/BUILD_INFO.txt <<EOF
          Winlator Ludashi Vanilla - Samsung Game Booster Test

          Commit:
          $BUILD_COMMIT

          Short commit:
          $BUILD_SHORT

          Build date:
          $BUILD_DATE

          Branch:
          $GITHUB_REF_NAME

          Package id:
          com.winlator

          Base:
          Winlator-Ludashi v4.1 Vanilla

          Samsung/Game Booster experiment:
          android:isGame=true
          android:appCategory=game
          extra Samsung metadata added
          package id changed to official Winlator id for recognition test

          Note:
          This build cannot be installed alongside official Winlator because it uses com.winlator.
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-Samsung-GameBooster
          path: artifacts/*
          if-no-files-found: error
